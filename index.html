<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles/index.css" />  
  <title>Frontend Mentor | Blog preview card</title>

  
</head>
<body>  
  <main class="main-container">
    <article class="blog-card">
      <img src="./assets/images/illustration-article.svg" class="card-image" alt="blog card image" />
      <section class="card-info">
        <p class="tag">Learning</p>
        <time>Published 21 Dec 2023</time>
        <h2>HTML & CSS foundations</h2>
        <p class="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </section>
      <footer class="author-info">
        <img src="./assets/images/image-avatar.webp" alt="author avatar" class="avatar" />
        <p>Greg Hooper</p>
      </footer>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Anil Dabas</a>.
  </footer>
</body>
</html>
